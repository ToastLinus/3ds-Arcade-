name: Build CIA
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4

      - name: Tools holen
        run: |
          apt-get update && apt-get install -y python3 unzip wget
          wget -q -O mr.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          unzip -o mr.zip -d mr
          wget -q -O bt.zip https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -o bt.zip -d bt
          chmod +x $(find mr -name makerom) $(find bt -name bannertool -path '*linux*x86_64*')

      - name: Icon und Banner erzeugen
        run: |
          python3 - <<'PY'
          import zlib, struct, wave
          def png(w, h, f, path):
              raw = b''.join(b'\x00' + b''.join(bytes(f(x, y, w, h)) for x in range(w)) for y in range(h))
              def ch(t, d):
                  c = struct.pack('>I', len(d)) + t + d
                  return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              open(path, 'wb').write(b'\x89PNG\r\n\x1a\n' + ch(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + ch(b'IDAT', zlib.compress(raw)) + ch(b'IEND', b''))
          def icon(x, y, w, h):
              r, g, b = 40 + y * 3, 30 + x * 2, 140 + y
              cx, cy = x // 12, y // 12
              if (cx + cy) % 2 == 0 and 6 <= x < w - 6 and 6 <= y < h - 6:
                  r, g, b = min(r + 70, 255), min(g + 70, 255), min(b + 60, 255)
              return (min(r, 255), min(g, 255), min(b, 255))
          def banner(x, y, w, h):
              return (30 + y // 2, 20 + x // 4, 110 + y // 2 + x // 8)
          png(48, 48, icon, 'icon.png')
          png(256, 128, banner, 'banner.png')
          s = wave.open('silent.wav', 'wb'); s.setnchannels(2); s.setsampwidth(2); s.setframerate(22050)
          s.writeframes(b'\x00' * 4 * 22050); s.close()
          PY

      - name: Bauen
        run: |
          arm-none-eabi-gcc -O2 -march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft -mword-relocations -ffunction-sections -fomit-frame-pointer -D__3DS__ \
            -I/opt/devkitpro/libctru/include -I/opt/devkitpro/portlibs/3ds/include \
            source/main.c -specs=3dsx.specs \
            -L/opt/devkitpro/libctru/lib -L/opt/devkitpro/portlibs/3ds/lib \
            -lcitro2d -lcitro3d -lctru -lm -o miniarcade.elf
          BT=$(find bt -name bannertool -path '*linux*x86_64*' | head -1)
          MR=$(find mr -name makerom | head -1)
          $BT makesmdh -s "Mini Arcade" -l "10 Spiele in einer App" -p "Mini Arcade" -i icon.png -o icon.icn
          $BT makebanner -i banner.png -a silent.wav -o banner.bnr
          $MR -f cia -o MiniArcade.cia -elf miniarcade.elf -rsf app.rsf -icon icon.icn -banner banner.bnr -exefslogo -target t

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mini Arcade Build ${{ github.run_number }}
          files: MiniArcade.cia
